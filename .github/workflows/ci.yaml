name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: docker.io

jobs:
  test:
    name: Test the repo # dummy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.13"
      
      - name: Install dependencies
        run: uv sync --locked --no-dev --no-install-project
      
      - name: Install pytest
        run: uv add pytest
      
      - name: Test using pytest
        run: echo "This is dummy test."
    
  build:
     name: Build and push
     needs: test
     if: github.event_name == 'push' && github.ref == 'refs/heads/main'
     runs-on: ubuntu-latest

     steps:
        - name: Docker login
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Build and PUsh
          uses: docker/build-push-action@v7
          with:
            push: true
            cache-from: type=registry,ref=pdevfig/temp-api-dhi:buildcache
            cache-to: type=registry,ref=pdevfig/temp-api-dhi:buildcache,mode=max
            tags: |
              pdevfig/temp-api-dhi:${{ github.sha }}
              pdevfig/temp-api-dhi:main
